<!doctype html>
<html lang="en" data-level-root="__LEVEL_ROOT__"__API_ROOT_ATTR__ data-static-site="__STATIC_SITE__">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sword Level Viewer</title>
    <link rel="icon" href="./static_assets/favicon.png" type="image/png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app">
      <aside class="level-menu">
        <div class="level-menu__header">
          <div class="level-menu__title-row">
            <h1>Battle Maps</h1>
            <button id="refreshLevelIndex" type="button" class="level-index-btn">Refresh map list</button>
          </div>
          <span id="levelCount">Loading</span>
        </div>
        <div id="levelList" class="level-list"></div>
      </aside>
      <section class="viewport" aria-label="Level viewport">
        <canvas id="levelCanvas"></canvas>
        <div class="toolbar">
          <button id="resetView" type="button" title="Reset view">Reset</button>
          <details id="layerMenu" class="layer-menu">
            <summary>Layers</summary>
            <div class="layer-menu__content">
              <label><input id="showLabels" type="checkbox"> Labels</label>
              <label><input id="showMeshes" type="checkbox" checked> Meshes</label>
              <label><input id="showTextured" type="checkbox" checked> Textured</label>
              <label><input id="showColliders" type="checkbox"> Colliders</label>
              <label><input id="showNoEnter" type="checkbox"> No enter</label>
              <label><input id="showEnter" type="checkbox"> Enter</label>
            </div>
          </details>
          <button id="showAllMeshes" type="button" class="show-all-meshes" hidden>Show all meshes</button>
        </div>
        <div id="status" class="status">Loading</div>
        <div id="renderStats" class="render-stats">0 polygons</div>
        <div id="meshTooltip" class="mesh-tooltip" hidden></div>
      </section>
      <aside class="inspector">
        <h1>Sword Level Viewer</h1>
        <dl id="summary"></dl>
        <hr>
        <h2>Selected Tile</h2>
        <dl id="selection"></dl>
        <hr>
        <div class="inspector-section-header">
          <h2>Selected Mesh</h2>
          <button id="hideSelectedMesh" type="button" class="inspector-action" disabled>Hide</button>
        </div>
        <dl id="meshSelection"></dl>
        <div id="meshMaterials" class="mesh-materials"></div>
      </aside>
    </main>
    <div id="extractModal" class="modal-overlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <h2>Extracting <code id="extractModalMap"></code></h2>
        </div>
        <div id="extractLog" class="extract-log"></div>
        <div class="modal-footer">
          <span id="extractModalStatus" class="modal-status">Running…</span>
          <button id="extractClose" type="button" class="modal-close-btn" disabled>Close</button>
        </div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
