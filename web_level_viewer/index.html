<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sword Level Viewer</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app">
      <aside class="level-menu">
        <div class="level-menu__header">
          <h1>Battle Maps</h1>
          <span id="levelCount">Loading</span>
        </div>
        <div id="levelList" class="level-list"></div>
      </aside>
      <section class="viewport" aria-label="Level viewport">
        <canvas id="levelCanvas"></canvas>
        <div class="toolbar">
          <button id="resetView" type="button" title="Reset view">Reset</button>
          <label><input id="showLabels" type="checkbox"> Labels</label>
          <label><input id="showMeshes" type="checkbox" checked> Meshes</label>
          <label><input id="showTextured" type="checkbox" checked> Textured</label>
          <label><input id="showColliders" type="checkbox"> Colliders</label>
          <label><input id="showNoEnter" type="checkbox"> No enter</label>
          <label><input id="showEnter" type="checkbox"> Enter</label>
        </div>
        <div id="status" class="status">Loading</div>
        <div id="renderStats" class="render-stats">0 polygons</div>
      </section>
      <aside class="inspector">
        <h1>Sword Level Viewer</h1>
        <dl id="summary"></dl>
        <hr>
        <h2>Selected Tile</h2>
        <dl id="selection"></dl>
      </aside>
    </main>
    <div id="extractModal" class="modal-overlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <h2>Extracting <code id="extractModalMap"></code></h2>
        </div>
        <div id="extractLog" class="extract-log"></div>
        <div class="modal-footer">
          <span id="extractModalStatus" class="modal-status">Running…</span>
          <button id="extractClose" type="button" class="modal-close-btn" disabled>Close</button>
        </div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
